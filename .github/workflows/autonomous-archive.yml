name: Autonomous basketball archive collector

on:
  schedule:
    - cron: "*/5 * * * *"
    - cron: "23 0 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Collect a snapshot, publish retained backlog, or both"
        type: choice
        options: [both, collect, publish]
        default: both
      ui_smoke:
        description: "Run optional UI acceptance checks after saving the snapshot"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - ".github/workflows/autonomous-archive.yml"
      - ".github/scripts/collect_live_with_models.cjs"
      - ".github/scripts/publish_daily_archive.py"
      - "static/app.js"
      - "static/forecast-core.js"
      - "static/index.html"
      - "server.py"

permissions:
  contents: read
  actions: read

concurrency:
  group: pari-live-archive-collector
  cancel-in-progress: false

jobs:
  collect-live-snapshot:
    if: (github.event_name == 'workflow_dispatch' && inputs.mode != 'publish') || github.event_name == 'push' || github.event.schedule == '*/5 * * * *'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-v1
      - name: Install headless browser for the site's own model calculations
        run: |
          npm install --prefix /tmp/pari-playwright playwright@1.57.0
          npx --prefix /tmp/pari-playwright playwright install chromium
      - name: Capture all live matches and run the site's forecast models
        env:
          SITE_URL: https://pari-basketball-ai.onrender.com/
          NODE_PATH: /tmp/pari-playwright/node_modules
          RUN_UI_SMOKE: ${{ inputs.ui_smoke && 'true' || 'false' }}
          ARCHIVE_CODE_SHA: ${{ github.sha }}
        run: node .github/scripts/collect_live_with_models.cjs
      - name: Store snapshot temporarily until daily consolidation
        if: ${{ always() && hashFiles('archive-snapshot/*.json.gz') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: pari-live-snapshot-${{ github.run_id }}-${{ github.run_attempt }}
          path: archive-snapshot/
          if-no-files-found: error
          retention-days: 7

  publish-daily-archive:
    needs: collect-live-snapshot
    if: ${{ always() && ((github.event_name == 'schedule' && github.event.schedule == '23 0 * * *') || (github.event_name == 'workflow_dispatch' && inputs.mode != 'collect')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Publish all retained unarchived snapshots as a verified ZIP release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/scripts/publish_daily_archive.py
