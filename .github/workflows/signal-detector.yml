name: Signal Telegram detector

on:
  schedule:
    - cron: '2-57/5 * * * *'
    - cron: '0 20 * * *' # 23:00 Europe/Moscow; also wakes a sleeping free service
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signal-telegram-detector
  cancel-in-progress: false

jobs:
  check-detector:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Restore notification history
        uses: actions/cache/restore@v4
        with:
          path: .signal-state
          key: signal-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: signal-state-
      - name: Restore outcomes and check daily report at 23 Moscow time
        env:
          SIGNAL_BOT_TOKEN: ${{ secrets.SIGNAL_BOT_TOKEN }}
          SIGNAL_CHAT_ID: ${{ secrets.SIGNAL_CHAT_ID }}
          SIGNAL_DATA_DIR: ${{ github.workspace }}/.signal-state
        run: python3 signal-bot/lifecycle_sync.py
      - name: Wake and check the server delivery loop
        env:
          SIGNAL_BOT_TOKEN: ${{ secrets.SIGNAL_BOT_TOKEN }}
          SIGNAL_CHAT_ID: ${{ secrets.SIGNAL_CHAT_ID }}
          SIGNAL_DATA_DIR: ${{ github.workspace }}/.signal-state
          PYTHONUNBUFFERED: '1'
        # The in-process server detector sends each new snapshot immediately.
        # This job only wakes/checks it; never start a second Telegram poller.
        run: python3 signal-bot/monitor.py --server-only
      - name: Preserve notification history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .signal-state
          key: signal-state-${{ github.run_id }}-${{ github.run_attempt }}
