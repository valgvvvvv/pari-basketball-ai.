name: Signal Telegram detector

on:
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signal-telegram-detector
  cancel-in-progress: false

jobs:
  check-detector:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore notification history
        uses: actions/cache/restore@v4
        with:
          path: .signal-state
          key: signal-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: signal-state-
      - name: Restore browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: signal-playwright-1.58.0-ubuntu24
      - name: Install monitor
        run: |
          pip install -r signal-bot/requirements.txt
          python -m playwright install chromium
      - name: Read detector and deliver new signals
        env:
          SIGNAL_BOT_TOKEN: ${{ secrets.SIGNAL_BOT_TOKEN }}
          SIGNAL_CHAT_ID: ${{ secrets.SIGNAL_CHAT_ID }}
          SIGNAL_FIRST_RUN_BASELINE: '1'
          SIGNAL_DATA_DIR: ${{ github.workspace }}/.signal-state
          PYTHONUNBUFFERED: '1'
        run: python signal-bot/monitor.py --once
      - name: Preserve notification history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .signal-state
          key: signal-state-${{ github.run_id }}-${{ github.run_attempt }}
