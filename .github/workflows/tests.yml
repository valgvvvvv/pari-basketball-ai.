name: Backend tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  live-statistics-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tests/forecast-core.test.cjs
      - run: node tests/signal-quality.test.cjs
      - run: node tests/regime.test.cjs
      - run: node tests/possession.test.cjs
      - run: node tests/learning.test.cjs
      - run: node --check scripts/replay_forecasts.cjs
      - run: node --check static/app.js
      - run: node --check .github/scripts/collect_live_with_models.cjs
      - run: python -m py_compile server.py result_validation.py match_identity.py .github/scripts/publish_daily_archive.py .github/scripts/restore_daily_archive.py
