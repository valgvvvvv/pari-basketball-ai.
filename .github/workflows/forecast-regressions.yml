name: Forecast regression checks
on:
  push:
    branches:
      - "audit/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: JavaScript syntax
        run: |
          node --check static/app.js
          node --check static/forecast-core.js
          node --check .github/scripts/collect_live_with_models.cjs
      - name: Forecast regression tests
        run: |
          node tests/forecast-core.test.cjs
          node tests/forecast-app.test.cjs
      - name: Backend regression tests
        run: |
          pip install -r requirements.txt
          python -m unittest discover -s tests -v
