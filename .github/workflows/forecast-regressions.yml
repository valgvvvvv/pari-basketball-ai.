name: Forecast regression checks
on:
  push:
    branches:
      - "audit/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: JavaScript syntax
        run: |
          node --check static/app.js
          node --check static/forecast-core.js
          node --check .github/scripts/collect_live_with_models.cjs
      - name: Forecast regression tests
        run: |
          node tests/forecast-core.test.cjs
          node tests/forecast-app.test.cjs
      - name: Install Playwright browser
        run: |
          npm install --prefix /tmp/pari-playwright playwright@1.57.0
          npx --prefix /tmp/pari-playwright playwright install chromium
      - name: Browser UI regression
        run: |
          python -m http.server 8000 >/tmp/pari-http.log 2>&1 &
          sleep 2
          node tests/browser-ui.test.cjs
      - name: Python syntax
        run: |
          python -m py_compile server.py .github/scripts/publish_daily_archive.py .github/scripts/restore_daily_archive.py
      - name: Backend regression tests
        run: |
          pip install -r requirements.txt
          python -m unittest discover -s tests -v
